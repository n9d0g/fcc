name: Deploy Web to Cloudflare

on:
  push:
    branches: [main, dev, nate]
    paths-ignore:
      - 'apps/cms/**'

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deploy target
        id: target
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          case "$BRANCH" in
            main)
              WRANGLER_ENV=""
              SITE_NAME="fcccanada.ca"
              DEPLOY_URL="https://fcccanada.ca"
              ;;
            dev)
              WRANGLER_ENV="qa"
              SITE_NAME="dev.fcccanada.ca"
              DEPLOY_URL="https://dev.fcccanada.ca"
              ;;
            nate)
              WRANGLER_ENV="nate"
              SITE_NAME="nate.fcccanada.ca"
              DEPLOY_URL="https://nate.fcccanada.ca"
              ;;
            *)
              WRANGLER_ENV="qa"
              SITE_NAME="dev.fcccanada.ca"
              DEPLOY_URL="https://dev.fcccanada.ca"
              ;;
          esac
          echo "wrangler_env=${WRANGLER_ENV}" >> "$GITHUB_OUTPUT"
          echo "site_name=${SITE_NAME}" >> "$GITHUB_OUTPUT"
          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true

      - name: Build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_GOOGLE_RECAPTCHA_SITE_KEY: ${{ secrets.PUBLIC_GOOGLE_RECAPTCHA_SITE_KEY }}
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          PUBLIC_SENTRY_ENVIRONMENT: ${{ steps.target.outputs.wrangler_env || 'production' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: vp run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: |
          set -o pipefail
          LOG="$(mktemp)"
          if [ -n "${{ steps.target.outputs.wrangler_env }}" ]; then
            vp exec wrangler deploy --env "${{ steps.target.outputs.wrangler_env }}" 2>&1 | tee "$LOG"
          else
            vp exec wrangler deploy --env "" 2>&1 | tee "$LOG"
          fi
          WORKERS_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$LOG" | head -1 || true)
          if [ -n "$WORKERS_URL" ]; then
            echo "url=${WORKERS_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Discord
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SITE_NAME: ${{ steps.target.outputs.site_name }}
          DEPLOY_URL: ${{ steps.target.outputs.deploy_url }}
          WORKERS_URL: ${{ steps.deploy.outputs.url }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          COMPARE_URL: ${{ github.event.compare }}
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set, skipping notification."
            exit 0
          fi

          BRANCH="${GITHUB_REF#refs/heads/}"
          case "$BRANCH" in
            main|dev)
              FINAL_URL="$DEPLOY_URL"
              ;;
            *)
              if [ -n "$WORKERS_URL" ]; then
                FINAL_URL="$WORKERS_URL"
              else
                FINAL_URL="$DEPLOY_URL"
              fi
              ;;
          esac

          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          RUN_URL="${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="${REPO_URL}/commit/${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          case "$DEPLOY_OUTCOME" in
            success) TITLE="🚀 ${SITE_NAME} deployed successfully"; COLOR=5763719; TITLE_URL="$FINAL_URL" ;;
            failure) TITLE="❌ ${SITE_NAME} deployment failed"; COLOR=15548997; TITLE_URL="$RUN_URL" ;;
            *) TITLE="⚠️ ${SITE_NAME} deployment ${DEPLOY_OUTCOME}"; COLOR=16705372; TITLE_URL="$RUN_URL" ;;
          esac

          # Commits in this push, newest first (fall back to HEAD if the payload has none)
          COMMITS=$(jq -r '
            if type == "array" and length > 0 then
              length as $n
              | (.[-10:] | reverse
                 | map("[`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0] | .[0:72]) — \(.author.username // .author.name)")
                 | join("\n"))
                + (if $n > 10 then "\n…and \($n - 10) more" else "" end)
            else empty end' <<< "$COMMITS_JSON" 2>/dev/null || true)
          if [ -z "$COMMITS" ]; then
            COMMITS="[\`${SHORT_SHA}\`](${COMMIT_URL}) $(git log -1 --pretty=%s | cut -c1-72)"
          fi

          DURATION=""
          STARTED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at 2>/dev/null || true)
          if [ -n "$STARTED_AT" ]; then
            ELAPSED=$(( $(date +%s) - $(date -d "$STARTED_AT" +%s) ))
            DURATION="$((ELAPSED / 60))m $((ELAPSED % 60))s"
          fi

          # On a successful dev deploy, link to the open dev → main PR, or to a prefilled one
          AHEAD=""
          PR_LABEL=""
          PR_URL=""
          if [ "$BRANCH" = "dev" ] && [ "$DEPLOY_OUTCOME" = "success" ]; then
            AHEAD=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...dev" --jq .ahead_by 2>/dev/null || true)
            OPEN_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head dev --base main --state open \
              --json number,url --jq '.[0] | select(.) | "\(.number) \(.url)"' 2>/dev/null || true)
            if [ -n "$OPEN_PR" ]; then
              PR_LABEL="🔀 View PR #${OPEN_PR%% *}"
              PR_URL="${OPEN_PR#* }"
            elif [ "${AHEAD:-0}" -gt 0 ]; then
              PR_LABEL="🔀 Create PR → main"
              PR_URL="${REPO_URL}/compare/main...dev?expand=1"
            fi
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg title_url "$TITLE_URL" \
            --argjson color "$COLOR" \
            --arg commits "$COMMITS" \
            --arg branch "$BRANCH" \
            --arg sha "$SHORT_SHA" \
            --arg commit_url "$COMMIT_URL" \
            --arg actor "$GITHUB_ACTOR" \
            --arg duration "$DURATION" \
            --arg ahead "$AHEAD" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg timestamp "$TIMESTAMP" \
            --arg outcome "$DEPLOY_OUTCOME" \
            --arg site_url "$FINAL_URL" \
            --arg run_url "$RUN_URL" \
            --arg compare_url "$COMPARE_URL" \
            --arg pr_label "$PR_LABEL" \
            --arg pr_url "$PR_URL" \
            '{
              embeds: [{
                title: $title,
                url: $title_url,
                color: $color,
                description: $commits,
                fields: (
                  [
                    {name: "Branch", value: ("`" + $branch + "`"), inline: true},
                    {name: "Commit", value: ("[`" + $sha + "`](" + $commit_url + ")"), inline: true},
                    {name: "Triggered by", value: $actor, inline: true}
                  ]
                  + (if $duration != "" then [{name: "Duration", value: $duration, inline: true}] else [] end)
                  + (if $ahead != "" then [{name: "Ahead of main", value: ($ahead + " commit(s)"), inline: true}] else [] end)
                ),
                footer: {text: ("Run #" + $run_number)},
                timestamp: $timestamp
              }],
              components: [{
                type: 1,
                components: (
                  (if $outcome == "success" then [{type: 2, style: 5, label: "🌐 Visit site", url: $site_url}] else [] end)
                  + [{type: 2, style: 5, label: "📋 Workflow run", url: $run_url}]
                  + (if $compare_url != "" then [{type: 2, style: 5, label: "🔍 View changes", url: $compare_url}] else [] end)
                  + (if $pr_url != "" then [{type: 2, style: 5, label: $pr_label, url: $pr_url}] else [] end)
                )
              }]
            }')

          # with_components lets a plain webhook send link buttons
          curl -fsS -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "${DISCORD_WEBHOOK_URL}?with_components=true"
