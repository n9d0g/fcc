name: Deploy CMS to Sanity

on:
  push:
    branches: [main]
    paths: ['apps/cms/**']
  workflow_dispatch:

concurrency:
  group: deploy-cms
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Sanity Studio
        id: deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: pnpm cms:deploy

      - name: Notify Discord
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          STUDIO_URL: https://fcc.sanity.studio
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set, skipping notification."
            exit 0
          fi

          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ' | cut -c1-100)
          BRANCH="${GITHUB_REF#refs/heads/}"
          DEPLOY_TIME=$(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %Z')

          case "$DEPLOY_OUTCOME" in
            success)
              MSG="🚀 **Sanity Studio** deployed successfully!\n\n\`\`\`Branch: ${BRANCH}\nCommit: ${COMMIT_SHA}\nDetails: ${COMMIT_MSG}\nTime: ${DEPLOY_TIME}\n\`\`\`\n\n🔗 **Studio:** ${STUDIO_URL}"
              ;;
            failure)
              MSG="❌ **Sanity Studio** deployment failed!\n\n\`\`\`Branch: ${BRANCH}\nCommit: ${COMMIT_SHA}\nDetails: ${COMMIT_MSG}\nTime: ${DEPLOY_TIME}\n\`\`\`\n\n🔗 **Studio:** ${STUDIO_URL}"
              ;;
            *)
              MSG="⚠️ **Sanity Studio** deployment status: ${DEPLOY_OUTCOME}\n\n\`\`\`Branch: ${BRANCH}\nCommit: ${COMMIT_SHA}\nDetails: ${COMMIT_MSG}\nTime: ${DEPLOY_TIME}\n\`\`\`\n\n🔗 **Studio:** ${STUDIO_URL}"
              ;;
          esac

          curl -fsS -H "Content-Type: application/json" \
            -X POST \
            -d "$(jq -n --arg content "$MSG" '{content: $content}')" \
            "$DISCORD_WEBHOOK_URL"
